feature_id: "0003"
feature_name: pbt-search
version: 1

criteria:
  - id: POPULATION_SIZE
    description: scheduler respects configured population size
    check:
      type: unit_test
      test: tests/unit/test_pbt_scheduler.py::test_population_size

  - id: EXPLOIT_TOP_K
    description: exploit copies from top fitness members
    check:
      type: unit_test
      test: tests/unit/test_pbt_scheduler.py::test_exploit_selects_top_k

  - id: EXPLORE_MUTATION
    description: explore members differ from parent lineage id
    check:
      type: unit_test
      test: tests/unit/test_pbt_scheduler.py::test_explore_creates_new_lineage

  - id: FITNESS_GATE
    description: failed harness runs receive non-competitive fitness
    check:
      type: unit_test
      test: tests/unit/test_pbt_fitness.py::test_failed_candidate_low_fitness
