[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "autokernel-pbt"
version = "0.1.0"
description = "Property-based testing for automated kernel development and translation"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
dependencies = [
  "numpy>=1.24",
  "pyyaml>=6.0",
  "jsonschema>=4.20",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.0",
  "pytest-cov>=4.1",
]
gpu = [
  "torch>=2.2",
]

[project.scripts]
akpbt = "autokernel_pbt.cli.main:main"

[tool.hatch.build.targets.wheel]
packages = ["src/autokernel_pbt"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
addopts = "-ra --strict-markers"
markers = [
  "gpu: requires CUDA GPU",
  "integration: cross-component tests",
  "spec: derived from specs/features acceptance criteria",
]

[tool.ruff]
line-length = 100
target-version = "py310"
