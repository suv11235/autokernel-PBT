name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        # 3.10/3.11 and 3.12+ format str-mixin enums differently (CLAUDE.md), so
        # both sides of that line are tested, not just the one CI happened to pin.
        python-version: ["3.10", "3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install
        run: pip install -e ".[dev]"

      - name: Lint
        run: ruff check src tests kernels scripts harness

      - name: Unit + spec tests
        run: >-
          pytest -m "not gpu" --cov=autokernel_pbt --cov-report=term-missing
          --cov-fail-under=95
